<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Topper Test Details</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      color: #333;
      padding: 40px;
    }
    h1 {
      text-align: center;
      color: #007acc; /* VS Code blue */
    }
    table {
      width: 80%;
      margin: 20px auto;
      border-collapse: collapse;
      background-color: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 12px 15px;
      border: 1px solid #ddd;
      text-align: center;
    }
    th {
      background-color: #007acc;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    .topper {
      background-color: #d1ffd6; /* highlight topper row */
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Class Topper Test Details</h1>
  
  <table>
    <tr>
      <th>Student Name</th>
      <th>Subject</th>
      <th>Marks</th>
      <th>Status</th>
    </tr>
    <tr>
      <td>Ayesha</td>
      <td>Math</td>
      <td>95</td>
      <td class="topper">Topper 🏆</td>
    </tr>
    <tr>
      <td>Ali</td>
      <td>Math</td>
      <td>88</td>
      <td>Passed</td>
    </tr>
    <tr>
      <td>Sara</td>
      <td>Math</td>
      <td>82</td>
      <td>Passed</td>
    </tr>
    <tr>
      <td>Hamza</td>
      <td>Math</td>
      <td>76</td>
      <td>Passed</td>
    </tr>
  </table>
</body>
</html>

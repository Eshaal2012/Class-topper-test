<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Topper Test Details</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      color: #333;
      padding: 40px;
    }
    h1 {
      text-align: center;
      color: #007acc;
    }
    table {
      width: 80%;
      margin: 20px auto;
      border-collapse: collapse;
      background-color: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 12px 15px;
      border: 1px solid #ddd;
      text-align: center;
    }
    th {
      background-color: #007acc;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    .topper {
      background-color: #d1ffd6;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Class Topper Test Details</h1>
  <table>
    <tr>
      <th>Student Name</th>
      <th>Subject</th>
      <th>Marks</th>
      <th>Status</th>
    </tr>
    {% for student in students %}
    <tr>
      <td>{{ student.name }}</td>
      <td>{{ student.subject }}</td>
      <td>{{ student.marks }}</td>
      <td class="{{ 'topper' if 'Topper' in student.status else '' }}">{{ student.status }}</td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
